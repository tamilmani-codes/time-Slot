
<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #263b65;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
            <th>Classroom</th>
        </tr>

        {% for slot in slots %}
        <tr>
            <td>{{ slot.day }}</td>

            <td>
                {{ slot.start_time|time:"h:i A" }}
                -
                {{ slot.end_time|time:"h:i A" }}
            </td>

            <td>{{ slot.subject_name }}</td>

            <td>{{ slot.faculty_name }}</td>

            <td>{{ slot.classroom }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5">No timetable records available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
